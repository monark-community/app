name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Opt every JavaScript action into Node 24. Drop this once
  # actions/checkout, actions/setup-node, and pnpm/action-setup publish
  # v5 tags that default to Node 24 natively.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# CI is split into four parallel jobs (lint+typecheck, unit, integration,
# repo-checks) plus a final coverage-upload job that depends on the two
# test jobs. Wall time is the slowest leg + the upload step, instead of
# the sum of every step in one job. The integration leg dominates at
# ~3 min ; everything else clears in under 2 min, so the verify gate
# closes in ~3:30.
#
# End-to-end Playwright tests are NOT auto-run on push / PR — they live
# in [.github/workflows/e2e.yml](./e2e.yml) and are triggered manually
# from the Actions tab when an auth / admin regression check is needed.

jobs:
  # Lint + typecheck only ; the lightest leg, usually wins the race
  # against the slower test legs.
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

  # Cross-package invariants — codegen drift + module-tier rules. Cheap
  # checks ; isolated in their own job so a stale generated file
  # doesn't masquerade as a lint or typecheck failure.
  repo-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check codegen drift
        run: |
          pnpm gen:events --check
          pnpm gen:routers --check

      - name: Check module tiers
        run: pnpm check:tiers

  # Unit suites only. Coverage outputs upload to a per-job artifact so
  # the codecov-upload job below can fuse them with the integration
  # leg's outputs into a merged report.
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test (with coverage)
        run: pnpm test:coverage

      # Per-package `coverage/unit/coverage-final.json` is what the
      # merge script in the codecov-upload job consumes. The artifact
      # bundles every package's `coverage/unit/` so the downstream
      # job has a single download to do.
      - name: Upload unit coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: |
            packages/*/coverage/unit/
            services/*/coverage/unit/
          if-no-files-found: error
          retention-days: 1

  # Integration suites only. The slow leg of CI ; each package boots a
  # Postgres testcontainer in `globalSetup`. Already parallelised
  # across packages by turbo's task graph ; this job just runs in
  # parallel with the lint-typecheck + unit + repo-checks legs so the
  # ~3 min cost doesn't pile on top of everything else.
  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test (integration, with coverage)
        run: pnpm test:integration:coverage

      - name: Upload integration coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-integration
          path: |
            packages/*/coverage/integration/
            services/*/coverage/integration/
          if-no-files-found: error
          retention-days: 1

  # Fuses unit + integration coverage into one report per package and
  # uploads to Codecov. Depends on both test jobs so the artifacts
  # exist by the time the merge runs.
  #
  # `unit-tests` and `integration-tests` upload to distinct artifacts
  # ; this job downloads both into the per-package `coverage/{unit,
  # integration}/` shape the merge script expects, then runs
  # `pnpm coverage:merge` to produce `coverage/coverage-final.json`
  # + `coverage/lcov.info` per package. Codecov reads the merged
  # lcov files via the explicit `files:` list (auto-discovery is
  # disabled to avoid uploading the per-run files alongside, which
  # would land three conflicting numbers per package).
  coverage-upload:
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Land each artifact at its origin path. The `path:` from the
      # upload step preserves the leading directories
      # (`packages/X/coverage/unit/...`), so a download with no
      # explicit path restores the same tree.
      - name: Download unit coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-unit

      - name: Download integration coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-integration

      - name: Merge coverage (unit + integration)
        run: pnpm coverage:merge

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: ./packages/auth/coverage/lcov.info,./packages/common/coverage/lcov.info,./packages/feature-flags/coverage/lcov.info,./packages/notifications/coverage/lcov.info,./packages/organizations/coverage/lcov.info,./packages/rbac/coverage/lcov.info,./packages/users/coverage/lcov.info,./packages/webhooks/coverage/lcov.info,./services/api/coverage/lcov.info,./services/web/coverage/lcov.info
          disable_search: true
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
