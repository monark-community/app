name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Opt every JavaScript action into Node 24. Drop this once
  # actions/checkout, actions/setup-node, and pnpm/action-setup publish
  # v5 tags that default to Node 24 natively.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # Fast verification gate : lint, typecheck, unit + integration
  # tests with coverage. Runs first ; PRs can't merge unless this
  # passes. Should clear in about 3 minutes once node_modules is
  # cached.
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check codegen drift
        run: |
          pnpm gen:events --check
          pnpm gen:routers --check

      - name: Check module tiers
        run: pnpm check:tiers

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (with coverage)
        run: pnpm test:coverage

      # Each package emits its own `coverage/lcov.info` ; we hand
      # them all to Codecov which aggregates into a single repo-level
      # number. Per-package coverage thresholds enforced inside vitest
      # are the actual gate ; Codecov is just for the badge + the
      # PR-level diff annotation. `fail_ci_if_error: false` keeps the
      # build green when CODECOV_TOKEN isn't set on a fork's CI.
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: |
            ./packages/auth/coverage/lcov.info
            ./packages/branding/coverage/lcov.info
            ./packages/common/coverage/lcov.info
            ./packages/feature-flags/coverage/lcov.info
            ./packages/notifications/coverage/lcov.info
            ./packages/organizations/coverage/lcov.info
            ./packages/rbac/coverage/lcov.info
            ./packages/users/coverage/lcov.info
            ./services/api/coverage/lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # Slower end-to-end gate : boots Supabase locally, runs the api +
  # web services, drives the browser through Playwright. Depends on
  # `verify` passing so we don't waste 10 minutes booting a stack
  # for code that doesn't typecheck.
  e2e:
    runs-on: ubuntu-latest
    needs: verify
    # `.env` files are gitignored, so CI has nothing to read at the
    # filesystem level. Set the local-stack defaults at the JOB level
    # so every step (Prisma migrate + the api/web processes that
    # Playwright spins up via `pnpm dev`) inherits them. Values match
    # what `supabase start` boots locally — fixed credentials baked
    # into the Supabase CLI's dev stack ; safe to hardcode because
    # the stack only listens on localhost and never leaves CI.
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:54322/postgres
      DIRECT_URL: postgresql://postgres:postgres@localhost:54322/postgres
      SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH
      SUPABASE_SECRET_KEY: sb_secret_N7UND0UgjKTVK-Uodkm0Hg_xSvEMPvz
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH
      WEB_ORIGIN: http://localhost:3000
      APP_URL: http://localhost:3000
      # Supabase's bundled Inbucket SMTP listener.
      SMTP_URL: smtp://localhost:54325
      SMTP_FROM: "Monark <noreply@monark.io>"
      # Deterministic test value ; never used outside the e2e job.
      TOTP_ENCRYPTION_KEY: d371e31288d4f5e19dd6e192ad7ab8edb3b2143695b23c70afba4d59ad8584c7
      # Single-tenant bootstrap so `/setup` finishes provisioning the
      # singleton org before any e2e spec hits a protected route.
      INITIAL_ORG_SLUG: monark
      INITIAL_ORG_NAME: Monark
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Supabase CLI ships postgres + auth + inbucket. `supabase
      # start` boots the whole stack on the standard ports
      # (54321 / 54322 / 54324 / 54325). This is the same surface
      # `pnpm dev` runs against locally, so the e2e suite tests
      # against an environment matching what humans test against.
      - name: Start Supabase local stack
        run: pnpm exec supabase start

      - name: Run database migrations
        run: pnpm db:migrate

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Run end-to-end suite
        run: pnpm test:e2e
        env:
          # `API_URL` is the only spec-only var that isn't already on
          # the job-level env block (which carries `APP_URL` since the
          # api process needs it for cross-origin checks). Specs use
          # this to reach the api directly.
          API_URL: http://localhost:4000

      # Always upload the Playwright HTML report so failures are
      # diagnosable without a re-run. The artefact viewer in the GH
      # Actions UI surfaces traces + screenshots + stdout per spec.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: services/web/playwright-report
          retention-days: 14
