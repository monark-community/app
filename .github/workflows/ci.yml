name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CI is split into five parallel legs (lint+typecheck, repo-checks,
# migration-drift, unit, integration) plus a coverage-upload job that
# depends on the two test jobs. Wall time is the slowest leg + the upload
# step, instead of the sum of every step in one job. The integration leg
# dominates at ~3 min ; everything else clears in under 2 min, so the
# verify gate closes in ~3:30.
#
# `ci-ok` at the bottom fans every leg back in and is the single context
# branch protection requires ; see the comment above that job before
# adding, renaming or removing a leg.
#
# End-to-end Playwright tests are NOT auto-run on push / PR — they live
# in [.github/workflows/e2e.yml](./e2e.yml) and are triggered manually
# from the Actions tab when an auth / admin regression check is needed.

jobs:
  # Lint + typecheck only ; the lightest leg, usually wins the race
  # against the slower test legs.
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

  # Cross-package invariants — codegen drift + module-tier rules. Cheap
  # checks ; isolated in their own job so a stale generated file
  # doesn't masquerade as a lint or typecheck failure.
  repo-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check codegen drift
        run: |
          pnpm gen:schema --check
          pnpm gen:events --check
          pnpm gen:routers --check

      - name: Check module tiers
        run: pnpm check:tiers

      - name: Check module completeness
        run: pnpm check:modules

      - name: Check i18n key parity
        run: pnpm check:i18n

      - name: Check public-API MCP visibility
        run: pnpm check:mcp

      # Supersedes the `changelog:check` step added in #73 : this covers the
      # same per-fragment link rule (shared with the compiler) plus the naming
      # convention, and its per-file mode backs the pre-commit hook.
      - name: Check changelog fragments
        run: pnpm check:changelog

      # Suites for the repo-level scripts in tools/. `pnpm test` is
      # `turbo run test`, which only reaches workspace packages ; tools/ is
      # not one, so its tests need their own invocation. They belong here
      # rather than in the unit-tests job because what they cover is the
      # check:* guards this job runs.
      - name: Test repo tooling
        run: pnpm test:tools

  # Migration ↔ schema drift. Replays every committed migration into a throwaway
  # Postgres and diffs the result against schema.prisma (modulo an allowlist of
  # raw-SQL divergences the Prisma datamodel can't express). Catches a modeled
  # change that shipped without a migration, or a migration hand-edited away from
  # the schema. Needs a real DB, so it's its own job with a `postgres` service
  # rather than folding into repo-checks.
  migration-drift:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shadow
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check migrations reproduce the committed schema
        run: pnpm check:migrations
        env:
          SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shadow

  # Unit suites only. Coverage outputs upload to a per-job artifact so
  # the codecov-upload job below can fuse them with the integration
  # leg's outputs into a merged report.
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test (with coverage)
        run: pnpm test:coverage

      # Per-package `coverage/unit/coverage-final.json` is what the
      # merge script in the codecov-upload job consumes. The artifact
      # bundles every package's `coverage/unit/` so the downstream
      # job has a single download to do.
      - name: Upload unit coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-unit
          path: |
            packages/*/coverage/unit/
            services/*/coverage/unit/
          if-no-files-found: error
          retention-days: 1

  # Integration suites only. The slow leg of CI ; each package boots a
  # Postgres testcontainer in `globalSetup`. Already parallelised
  # across packages by turbo's task graph ; this job just runs in
  # parallel with the lint-typecheck + unit + repo-checks legs so the
  # ~3 min cost doesn't pile on top of everything else.
  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test (integration, with coverage)
        run: pnpm test:integration:coverage

      - name: Upload integration coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-integration
          path: |
            packages/*/coverage/integration/
            services/*/coverage/integration/
          if-no-files-found: error
          retention-days: 1

  # Fuses unit + integration coverage into one report per package and
  # uploads to Codecov. Depends on both test jobs so the artifacts
  # exist by the time the merge runs.
  #
  # `unit-tests` and `integration-tests` upload to distinct artifacts
  # ; this job downloads both into the per-package `coverage/{unit,
  # integration}/` shape the merge script expects, then runs
  # `pnpm coverage:merge` to produce `coverage/coverage-final.json`
  # + `coverage/lcov.info` per package. The upload step globs those
  # merged lcov files (one per package that emitted coverage) so the
  # file set stays in lockstep with the package list — a newly-tested
  # module is picked up with no edit here — while `disable_search`
  # still stops Codecov from also grabbing any stray per-run lcov.
  coverage-upload:
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Land each artifact at its origin path. The `path:` from the
      # upload step preserves the leading directories
      # (`packages/X/coverage/unit/...`), so a download with no
      # explicit path restores the same tree.
      - name: Download unit coverage
        uses: actions/download-artifact@v8
        with:
          name: coverage-unit

      - name: Download integration coverage
        uses: actions/download-artifact@v8
        with:
          name: coverage-integration

      - name: Merge coverage (unit + integration)
        run: pnpm coverage:merge

      # Enumerate exactly the merged per-package lcov files the merge step
      # produced. Globbing keeps this in lockstep with the package set — the
      # previous hardcoded list had silently gone stale, omitting 8 tested
      # packages (api-keys, automation, calendar, data-models, files, kanban,
      # secrets, query) from the Codecov dashboard.
      - name: Collect merged lcov files
        id: lcov
        if: always()
        run: |
          files=$(find packages services -maxdepth 3 -path '*/coverage/lcov.info' | sort | paste -sd, -)
          echo "Uploading lcov files: $files"
          echo "files=$files" >> "$GITHUB_OUTPUT"

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v7
        with:
          files: ${{ steps.lcov.outputs.files }}
          disable_search: true
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ── The single required check ────────────────────────────────────────────
  #
  # Every leg above feeds into this one job, and `ci-ok` is the ONLY context
  # branch protection requires on `develop` / `main`. That indirection exists
  # because a required context is matched by NAME against the checks a run
  # actually reported, and a pull request whose branch predates a new job never
  # reports it — GitHub then waits forever on a check no run will ever produce.
  # That is exactly how the whole Dependabot backlog ended up unmergeable when
  # `migration-drift` was added: every visible check green, `mergeable_state:
  # blocked`, no way out but a rebase of every open PR.
  #
  # With one stable aggregate context, adding, renaming, splitting or removing
  # a leg is a pure edit to this file ; in-flight PRs pick it up on their next
  # run and nothing is ever stranded. So: add new jobs to `needs` here, and
  # never add a second required context to the ruleset.
  #
  # `if: always()` so the job runs even when an upstream leg failed or was
  # skipped ; without it the job would itself be skipped and report nothing,
  # recreating the same stuck state it exists to prevent. The step then fails
  # unless every dependency's result is exactly `success` — `failure`,
  # `cancelled` and `skipped` all block the merge.
  ci-ok:
    name: ci-ok
    runs-on: ubuntu-latest
    if: always()
    needs:
      - lint-typecheck
      - repo-checks
      - migration-drift
      - unit-tests
      - integration-tests
      - coverage-upload
    steps:
      - name: Verify every CI leg succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          not_ok=$(echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result != "success") | "  \(.key): \(.value.result)"')
          if [ -n "$not_ok" ]; then
            echo "::error::CI did not fully pass:"
            echo "$not_ok"
            exit 1
          fi
          echo "All CI legs succeeded."
