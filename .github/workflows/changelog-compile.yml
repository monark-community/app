name: Compile changelog

# Rebuilds CHANGELOG.md from the changelog.d/ fragments and commits the result
# straight to develop.
#
# The fragments are the source of truth ; CHANGELOG.md is a generated artifact
# (see changelog.d/README.md). A PR only ever adds its own new fragment file,
# never touching the compiled file — with several branches in flight at once,
# everyone editing one shared file collided on the same insertion point every
# time. Regeneration happens here, once, serialized on develop.
#
# Self-limiting: this bot's own commit pushes to develop and re-triggers the
# workflow, but the second run regenerates identical content, finds no diff,
# and exits without committing — no loop, just one cheap no-op run per real
# change.

on:
  push:
    branches: [develop]

concurrency:
  group: changelog-compile-${{ github.ref }}
  cancel-in-progress: false # never cancel a mid-flight commit-and-push

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: develop

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild CHANGELOG.md from fragments
        run: pnpm changelog:compile

      - name: Commit + push if changed
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore: rebuild changelog from fragments"
          git push origin HEAD:develop
