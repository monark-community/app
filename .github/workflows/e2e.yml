name: E2E

# Manual-trigger only. The end-to-end suite (Playwright + a full
# Supabase + api + web stack) costs ~13 min of test time + ~5 min of
# browser install + ~3 min of stack boot — north of 20 min on every
# push isn't worth paying for what's primarily a regression-net for
# the auth + admin flows. Devs run `pnpm test:e2e` locally before
# touching those surfaces ; CI runs this workflow on demand from the
# Actions tab when a PR needs an e2e regression check.
#
# To trigger : Actions → E2E → Run workflow → pick a branch.
on:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  # Opt every JavaScript action into Node 24. Drop this once
  # actions/checkout, actions/setup-node, and pnpm/action-setup publish
  # v5 tags that default to Node 24 natively.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # End-to-end suite : boots Supabase locally, runs the api + web
  # services, drives the browser through Playwright. Single-runner job
  # since the supabase stack + dev server can't be split across
  # machines without serialising a fixture export.
  e2e:
    runs-on: ubuntu-latest
    # `.env` files are gitignored, so CI has nothing to read at the
    # filesystem level. Set the local-stack defaults at the JOB level
    # so every step (Prisma migrate + the api/web processes that
    # Playwright spins up via `pnpm dev`) inherits them. Values match
    # what `supabase start` boots locally — fixed credentials baked
    # into the Supabase CLI's dev stack ; safe to hardcode because
    # the stack only listens on localhost and never leaves CI.
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:54322/postgres
      DIRECT_URL: postgresql://postgres:postgres@localhost:54322/postgres
      SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH
      SUPABASE_SECRET_KEY: sb_secret_N7UND0UgjKTVK-Uodkm0Hg_xSvEMPvz
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH
      WEB_ORIGIN: http://localhost:3000
      APP_URL: http://localhost:3000
      # Supabase's bundled Inbucket SMTP listener.
      SMTP_URL: smtp://localhost:54325
      SMTP_FROM: "Monark <noreply@monark.io>"
      # Deterministic test value ; never used outside the e2e job.
      TOTP_ENCRYPTION_KEY: d371e31288d4f5e19dd6e192ad7ab8edb3b2143695b23c70afba4d59ad8584c7
      # Single-tenant bootstrap so `/setup` finishes provisioning the
      # singleton org before any e2e spec hits a protected route.
      INITIAL_ORG_SLUG: monark
      INITIAL_ORG_NAME: Monark
      # Opt every gated e2e spec into running.
      E2E_FULL_STACK: "1"
      INBUCKET_URL: http://localhost:54324
      # Surface which (authed) gate redirect fires on each bounce so the
      # next failing run reveals whether sign-ins are being rejected by
      # the session check or the trusted-device check. The (authed)
      # layout writes a `[(authed)/layout] redirect: <reason>` line to
      # stderr only when this is set ; keep it on for the e2e job until
      # the bounce-loop is fixed, then drop it.
      MONARK_AUTH_GATE_DEBUG: "1"
      # Seeded test accounts. The seed step below provisions both
      # users + grants ADMIN at the singleton org to the admin one.
      # Passwords are deterministic test values — the runner only
      # listens on localhost and the stack is torn down at job end.
      # Strong-enough to clear the password-rule validator (>=12
      # chars, mixed classes, no obvious dictionary words).
      E2E_USER_EMAIL: e2e-user@monark.test
      E2E_USER_PASSWORD: "Tg7!hP9q*xLb-user"
      E2E_ADMIN_EMAIL: e2e-admin@monark.test
      E2E_ADMIN_PASSWORD: "Tg7!hP9q*xLb-admin"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Supabase CLI ships postgres + auth + inbucket. `supabase
      # start` boots the whole stack on the standard ports
      # (54321 / 54322 / 54324 / 54325). This is the same surface
      # `pnpm dev` runs against locally, so the e2e suite tests
      # against an environment matching what humans test against.
      - name: Start Supabase local stack
        run: pnpm exec supabase start

      - name: Run database migrations
        run: pnpm db:migrate

      # Provision the e2e test accounts the gated specs sign in as.
      # Idempotent ; safe on CI re-runs and on the rare local
      # invocation. Bootstraps the singleton org along the way so
      # the ADMIN grant has somewhere to scope to (the api process
      # would do this at boot anyway, but Playwright doesn't start
      # the api until after this step).
      - name: Seed e2e test users
        run: pnpm tsx tools/seed-e2e-users.ts

      # Only install Chromium ; the Playwright config's `projects`
      # array runs against Chromium alone, so pulling Firefox + WebKit
      # binaries (and their `--with-deps` apt prerequisites) costs
      # ~5 min for nothing. Add browsers back here only when a project
      # is added to the playwright config that exercises them.
      - name: Install Playwright browsers
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Run end-to-end suite
        run: pnpm test:e2e
        env:
          # `API_URL` is the only spec-only var that isn't already on
          # the job-level env block (which carries `APP_URL` since the
          # api process needs it for cross-origin checks). Specs use
          # this to reach the api directly.
          API_URL: http://localhost:4000

      # Always upload the Playwright HTML report so failures are
      # diagnosable without a re-run. The artefact viewer in the GH
      # Actions UI surfaces traces + screenshots + stdout per spec.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: services/web/playwright-report
          retention-days: 14
