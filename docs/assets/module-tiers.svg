<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 372" width="540" height="372" role="img" aria-labelledby="title desc">
  <title id="title">The two-tier module system</title>
  <desc id="desc">Extended modules may depend on core modules but never on each other. Core modules are coupled and ship with every deploy. Neither tier imports the platform substrate: both register into it at api boot.</desc>
  <style>
    /* Sized for the article column so it renders 1:1 rather than being scaled
       down until the labels stop being readable. Colours are authored against
       the page background, with the dark block only lifting the ink, so one
       file serves both themes. */
    .ink { fill: #3f3f46; }
    .muted { fill: #71717a; }
    .panel { fill: none; stroke: #d4d4d8; }
    .chip { fill: none; stroke: #a1a1aa; }
    .accent { stroke: #f0870c; }
    .accent-fill { fill: #f0870c; }
    .no { stroke: #a1a1aa; }
    text { font-family: "Nunito Sans", ui-sans-serif, system-ui, sans-serif; }
    .h { font-size: 13px; font-weight: 700; }
    .l { font-size: 11.5px; }
    .s { font-size: 10.5px; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #e4e4e7; }
      .muted { fill: #a1a1aa; }
      .panel { stroke: #3f3f46; }
      .chip { stroke: #52525b; }
      .no { stroke: #71717a; }
    }
  </style>

  <!-- Extended -->
  <rect x="8" y="8" width="524" height="86" rx="9" class="panel" stroke-dasharray="5 4" />
  <text x="22" y="30" class="h ink">Extended modules</text>
  <text x="152" y="30" class="s muted">removable · one per business feature</text>
  <g class="chip">
    <rect x="22" y="44" width="74" height="26" rx="13" />
    <rect x="104" y="44" width="66" height="26" rx="13" />
    <rect x="178" y="44" width="54" height="26" rx="13" />
    <rect x="240" y="44" width="104" height="26" rx="13" />
  </g>
  <g class="l ink" text-anchor="middle">
    <text x="59" y="61">calendar</text>
    <text x="137" y="61">kanban</text>
    <text x="205" y="61">wiki</text>
    <text x="292" y="61">achievements</text>
  </g>
  <text x="352" y="61" class="s muted">+ 4 integrations</text>

  <!-- The rule that defines the tier : no sideways dependency -->
  <g fill="none" stroke-width="1.4" class="no" stroke-dasharray="3 3">
    <path d="M 96 78 C 116 92, 148 92, 168 78" />
  </g>
  <g transform="translate(125, 76)">
    <path d="M -6 -6 L 6 6 M 6 -6 L -6 6" class="no" stroke-width="1.4" />
  </g>
  <text x="180" y="86" class="s muted">never on each other</text>

  <!-- Dependency edge -->
  <g class="accent" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M 70 96 L 70 126" />
    <path d="M 460 96 L 460 126" />
  </g>
  <text x="86" y="116" class="s muted">may depend on core</text>

  <!-- Core -->
  <rect x="8" y="128" width="524" height="86" rx="9" class="panel" />
  <text x="22" y="150" class="h ink">Core modules</text>
  <text x="124" y="150" class="s muted">coupled · ship with every deploy</text>
  <g class="chip">
    <rect x="22" y="164" width="48" height="26" rx="13" />
    <rect x="78" y="164" width="54" height="26" rx="13" />
    <rect x="140" y="164" width="52" height="26" rx="13" />
    <rect x="200" y="164" width="94" height="26" rx="13" />
    <rect x="302" y="164" width="92" height="26" rx="13" />
  </g>
  <g class="l ink" text-anchor="middle">
    <text x="46" y="181">auth</text>
    <text x="105" y="181">rbac</text>
    <text x="166" y="181">users</text>
    <text x="247" y="181">data-models</text>
    <text x="348" y="181">notifications</text>
  </g>
  <text x="402" y="181" class="s muted">+ 11 more</text>

  <!-- Registration edge -->
  <g class="accent" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M 70 216 L 70 246" />
    <path d="M 460 216 L 460 246" />
  </g>
  <text x="86" y="236" class="s muted">register at boot, never import</text>

  <!-- Substrate -->
  <rect x="8" y="248" width="524" height="112" rx="9" class="panel" />
  <text x="22" y="270" class="h ink">Platform substrate</text>
  <text x="164" y="270" class="s muted">registries wired in services/api/src/server.ts</text>
  <g class="chip">
    <rect x="22" y="284" width="112" height="28" rx="7" />
    <rect x="142" y="284" width="112" height="28" rx="7" />
    <rect x="262" y="284" width="112" height="28" rx="7" />
    <rect x="382" y="284" width="128" height="28" rx="7" />
    <rect x="22" y="320" width="112" height="28" rx="7" />
    <rect x="142" y="320" width="112" height="28" rx="7" />
    <rect x="262" y="320" width="112" height="28" rx="7" />
    <rect x="382" y="320" width="128" height="28" rx="7" />
  </g>
  <g class="l ink" text-anchor="middle">
    <text x="78" y="302">permissions</text>
    <text x="198" y="302">event bus</text>
    <text x="318" y="302">feature flags</text>
    <text x="446" y="302">notification kinds</text>
    <text x="78" y="338">webhooks</text>
    <text x="198" y="338">nav + search</text>
    <text x="318" y="338">prisma schema</text>
    <text x="446" y="338">automation nodes</text>
  </g>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="accent-fill" />
    </marker>
  </defs>
</svg>
